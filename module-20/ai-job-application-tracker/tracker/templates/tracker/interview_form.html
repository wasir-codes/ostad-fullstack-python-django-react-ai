{% extends 'tracker/base.html' %}
{% block title %}Add Interview{% endblock %}
{% block content %}
<h2 class="mb-4">Add Interview - {{ application.job_title }}</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">{{ form.interview_datetime.label }}</label>
        {{ form.interview_datetime }}
    </div>
    <div class="mb-3">
        <label class="form-label">{{ form.interview_type.label }}</label>
        {{ form.interview_type }}
    </div>
    <div class="mb-3">
        <label class="form-label">{{ form.meeting_link.label }}</label>
        {{ form.meeting_link }}
    </div>
    <div class="mb-3">
        <label class="form-label">{{ form.notes.label }}</label>
        {{ form.notes }}
    </div>
    <button type="submit" class="btn btn-primary">Save Interview</button>
    <a href="{% url 'application_detail' application.pk %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
