<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ostad Bank{% endblock %}</title>
    <!-- bootstrap via CDN, no build step needed -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- our own theme overrides, loaded after bootstrap so it takes priority -->
    <link href="{% static 'bank/custom.css' %}" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Ostad Bank</a>
            {% if user.is_authenticated %}
            <div class="d-flex">
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'dashboard' %}">Dashboard</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'deposit' %}">Deposit</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'withdraw' %}">Withdraw</a>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'transaction_history' %}">History</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout ({{ user.username }})</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
