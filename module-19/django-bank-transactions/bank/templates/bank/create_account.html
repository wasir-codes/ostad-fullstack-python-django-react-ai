{% extends 'bank/base.html' %}
{% block title %}Create Bank Account{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-3">Set Up Your Bank Account</h2>
        <p class="text-muted">You need an account before you can deposit or withdraw money.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
    </div>
</div>
{% endblock %}
